name: Synchronisation Notion

on:
  schedule:
    - cron: "0 5 * * *"   # tous les jours, vers 6 h ou 7 h (heure de Paris)
  workflow_dispatch:       # lancement manuel : onglet Actions > Synchronisation Notion > Run workflow

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Lire Notion et régénérer la page chiffrée
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          KPI_PASSWORD: ${{ secrets.KPI_PASSWORD }}
        run: python scripts/sync.py
      - name: Publier si la page a changé
        run: |
          git config user.name "kpi-sync"
          git config user.email "kpi-sync@users.noreply.github.com"
          git add index.html .sync-state
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "Synchronisation Notion $(date -u +%F)"
            git push
          fi
